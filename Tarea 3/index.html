<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Simple</title>
    <link rel="stylesheet" href="styles.css">

    <!-- Favicon estándar -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
    <link rel="shortcut icon" href="favicon_io/favicon.ico">

    <!-- Iconos para dispositivos Android -->
    <link rel="icon" type="image/png" sizes="192x192" href="favicon_io/android-chrome-192x192.png">

    <!-- Icono para dispositivos Apple -->
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">

    <!-- Archivo manifest para compatibilidad con apps web progresivas -->
    <link rel="manifest" href="favicon_io/site.webmanifest">
</head>
<body>
    <header class="header">
        <h1>🧮 Calculadora</h1>
    </header>

    <div class="calculadora">
        <div id="pantalla">0</div>
        <div class="botones">
            <button class="numero">7</button>
            <button class="numero">8</button>
            <button class="numero">9</button>
            <button class="operador">+</button>
            <button class="numero">4</button>
            <button class="numero">5</button>
            <button class="numero">6</button>
            <button class="operador">-</button>
            <button class="numero">1</button>
            <button class="numero">2</button>
            <button class="numero">3</button>
            <button class="operador">*</button>
            <button class="numero">0</button>
            <button id="decimal">.</button>
            <button class="operador">^</button>
            <button class="operador">/</button>
            <button id="limpiar">C</button>
            <button id="igual">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
