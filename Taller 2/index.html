<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Práctico de CSS Layouts</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=M+PLUS+Rounded+1c&display=swap" rel="stylesheet">

    <!-- Favicon estándar -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
    <link rel="shortcut icon" href="favicon_io/favicon.ico">

    <!-- Iconos para dispositivos Android -->
    <link rel="icon" type="image/png" sizes="192x192" href="favicon_io/android-chrome-192x192.png">

    <!-- Icono para dispositivos Apple -->
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">

    <!-- Archivo manifest para compatibilidad con apps web progresivas -->
    <link rel="manifest" href="favicon_io/site.webmanifest">
</head>
<body>
    <div class="main-grid">
        <!-- Header -->
        <header class="header">
            <h1>📚 Biblioteca Digital Académica</h1>
            <p>Tu portal al conocimiento y la literatura universal</p>
        </header>

        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>Filtrar por Categoría</h2>
            <button class="mobile-filter-toggle" onclick="toggleFilters()">
                Mostrar Filtros
            </button>
            <div class="filters" id="filters">
                <button class="filter-btn active" data-category="all">Todas las Categorías</button>
                <button class="filter-btn" data-category="ficcion">Ficción</button>
                <button class="filter-btn" data-category="no-ficcion">No ficción</button>
                <button class="filter-btn" data-category="ciencia">Ciencia</button>
                <button class="filter-btn" data-category="historia">Historia</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="content">
            <h2>Catálogo de Libros</h2>
            <div class="book-catalog" id="bookCatalog">
                <!-- Books will be inserted here by JavaScript -->
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2025 Biblioteca Digital Académica. Todos los derechos reservados.</p>
            <p>Fomentando el acceso libre al conocimiento</p>
        </footer>
    </div>

    <script>
        const books = [
            {
                id: 1, 
                title: "El Ingenioso Hidalgo Don Quijote de la Mancha",
                author: "Miguel de Cervantes",
                category: "ficcion",
                cover: "covers/1.gif"
            },
            {
                id: 2,
                title: "Cien años de soledad",
                author: "Gabriel García Márquez",
                category: "ficcion",
                cover: "covers/2.gif"
            },
            {
                id: 3,
                title: "1984",
                author: "George Orwell",
                category: "ficcion",
                cover: "covers/3.jpg"
            },
            {
                id: 4,
                title: "Sapiens: De animales a dioses",
                author: "Yuval Noah Harari",
                category: "historia",
                cover: "covers/4.jpg"
            },
            {
                id: 5,
                title: "Breve historia del tiempo",
                author: "Stephen Hawking",
                category: "ciencia",
                cover: "covers/5.webp"
            },
            {
                id: 6,
                title: "El origen de las especies",
                author: "Charles Darwin",
                category: "ciencia",
                cover: "covers/6.jpg"
            },
            {
                id: 7,
                title: "Historia del mundo en 12 mapas",
                author: "Jerry Brotton",
                category: "historia",
                cover: "covers/7.jpg"
            },
            {
                id: 8,
                title: "El arte de la guerra",
                author: "Sun Tzu",
                category: "historia",
                cover: "covers/8.webp"
            },
            {
                id: 9,
                title: "Cosmos",
                author: "Carl Sagan",
                category: "ciencia",
                cover: "covers/9.webp"
            },
            {
                id: 10,
                title: "La metamorfosis",
                author: "Franz Kafka",
                category: "ficcion",
                cover: "covers/10.jpg"
            },
            {
                id: 11,
                title: "Pensar rápido, pensar despacio",
                author: "Daniel Kahneman",
                category: "no-ficcion",
                cover: "covers/11.jpg"
            },
            {
                id: 12,
                title: "Padre rico, padre pobre",
                author: "Robert Kiyosaki",
                category: "no-ficcion",
                cover: "covers/12.jpg"
            }
        ];

        const categoryNames = {
            'ficcion': 'Ficción',
            'no-ficcion': 'No ficción',
            'ciencia': 'Ciencia',
            'historia': 'Historia'
        };

        const bookCatalog = document.getElementById('bookCatalog');
        const filterButtons = document.querySelectorAll('.filter-btn');

        function renderBooks(booksToShow = books) {
            bookCatalog.innerHTML = '';
            
            booksToShow.forEach(book => {
                const bookCard = document.createElement('div');
                bookCard.className = 'book-card';
                bookCard.innerHTML = `
                    <img src="${book.cover}" alt="${book.title}" class="book-cover">
                    <div class="book-title">${book.title}</div>
                    <div class="book-author">por ${book.author}</div>
                    <span class="book-category">${categoryNames[book.category]}</span>
                `;
                bookCatalog.appendChild(bookCard);
            });
        }

        function filterBooks(category) {
            const filteredBooks = category === 'all' ? books : books.filter(book => book.category === category);
            renderBooks(filteredBooks);
        }

        function toggleFilters() {
            const filters = document.getElementById('filters');
            const toggle = document.querySelector('.mobile-filter-toggle');
            
            filters.classList.toggle('show');
            toggle.textContent = filters.classList.contains('show') ? 'Ocultar Filtros' : 'Mostrar Filtros';
        }

        filterButtons.forEach(button => {
            button.addEventListener('click', () => {
                filterButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                const category = button.getAttribute('data-category');
                filterBooks(category);
            });
        });

        renderBooks();
    </script>
</body>
</html>
