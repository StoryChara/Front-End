<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESARROLLO WEB FRONT-END</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=M+PLUS+Rounded+1c&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 3rem 2rem;
            margin-bottom: 3rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 800px;
            width: 100%;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 1rem;
            letter-spacing: -0.5px;
        }

        header h1 i {
            color: #667eea;
            margin-left: 10px;
        }

        header p {
            font-size: 1.2rem;
            color: #4a5568;
            font-weight: 400;
        }

        header p i {
            margin: 0 8px;
            transition: transform 0.3s ease;
        }

        header p i:hover {
            transform: scale(1.2);
        }

        .fa-html5 {
            color: #e34f26;
        }

        .fa-css3-alt {
            color: #1572b6;
        }

        .fa-js {
            color: #f7df1e;
        }

        .fa-terminal {
            color: #4a5568;
        }

        #Tareas {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2.5rem;
            margin-bottom: 3rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 2rem;
            max-width: 600px;
            width: 100%;
        }

        #Tareas a {
            display: inline-block;
            padding: 1.5rem 2rem;
            background: rgba(255, 255, 255, 0.8);
            color: #2d3748;
            text-decoration: none;
            border-radius: 15px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            text-align: center;
            border: 3px solid transparent;
            background-clip: padding-box;
            position: relative;
        }

        #Tareas a::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            z-index: -1;
        }

        #Tareas a:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
            color: white;
        }

        #Tareas a:hover::before {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        #Tareas a i {
            margin-right: 10px;
            font-size: 1.2rem;
            text-shadow: rgba(255, 255, 255, 1) 0px 0px 5px;
        }

        footer {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 1.5rem 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }

        footer p {
            text-align: center;
            font-size: 0.9rem;
            color: #4a5568;
            font-weight: 400;
        }
    </style>

    <!-- Favicon estándar -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
    <link rel="shortcut icon" href="favicon_io/favicon.ico">
    <!-- Iconos para dispositivos Android -->
    <link rel="icon" type="image/png" sizes="192x192" href="favicon_io/android-chrome-192x192.png">
    <!-- Icono para dispositivos Apple -->
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
    <!-- Archivo manifest para compatibilidad con apps web progresivas -->
    <link rel="manifest" href="favicon_io/site.webmanifest">
</head>

<body>
    <header>
        <h1>DESARROLLO WEB FRONT-END <i class="fa-regular fa-file-code"></i></h1>
        <p>HTML <i class="fa-brands fa-html5"></i> CSS <i class="fa-brands fa-css3-alt"></i> y JavaScript <i class="fa-brands fa-js"></i> <br/> 
            <i class="fa-solid fa-terminal"></i> María José Jara Herrera</p>
    </header>

    <section id="Tareas">
        <a href="Tarea 0/index.html"><i class="fa-brands fa-html5"></i> Tarea 0 - Cafetería</a>
        <a href="Taller 1/index.html"><i class="fa-brands fa-html5"></i> Taller 1 - Práctico de HTML</a>
        <a href="Taller 2/index.html"><i class="fa-brands fa-html5"></i><i class="fa-brands fa-css3-alt"></i> Taller 2 - Práctico de CSS Layouts</a>
        <a href="Tarea 3/index.html"><i class="fa-brands fa-html5"></i><i class="fa-brands fa-css3-alt"></i><i class="fa-brands fa-js"></i> Tarea 3 - Calculadora</a>
        <a href="Taller 4/index.html"><i class="fa-brands fa-html5"></i><i class="fa-brands fa-css3-alt"></i><i class="fa-brands fa-js"></i> Taller 4 - Taller JS - Eventos biblioteca</a>
    </section>

    <footer>
        <p>&copy; 2025 María José Jara Herrera. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
